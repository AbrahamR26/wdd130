<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Forms</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
    <header>

        <h1>
            <title>Contact information</title>
            <legend>Questions</legend>
        </h1>
        <main>
            <form>
                <fieldset>
                    <legend>Contact Information</legend>
                    <label for="fullname">Full name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                    <label for="useremail">Email:</label>
                    <input type="email" id="useremail" name="useremail" required>
                </fieldset>

                <fieldset>
                    <legend>Questions</legend>
                    <label for="quantity">What is your favorite Internet browser</label>
                    <select name="quantity" id="quantity">
                        <option value="1">Chorme</option>
                        <option value="2">Firefox</option>
                        <option value="3">Safari</option>
                        <option value="4">Brave</option>
                    </select>
                    <label for="pet">Do you have a household pet?</label>
                    <input type="checkbox" id="pet" name="pet">
                    <label for="places">List the places you have lived:</label>
                    <textarea id="places" name="places" rows="4" placeholder="Stillwater Forida, Amsterdam Netherlands, Timbuktu Mali"></textarea>
                </fieldset>
                <button type="submit">Submit Poll</button>
            </form>

        </main>
    </header>
    <footer>©2026 | Abraham Romano</footer>
</body>

</html>
